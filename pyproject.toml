[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omoide"
version = "1.0.0"
description = "Local-first, content-searchable clipboard history for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omoide contributors" }]
dependencies = [
    "pywin32>=306",
    "pillow>=10",
    "pystray>=0.19",
    "keyboard>=0.13.5",
    "pywebview>=5.0",
    "typer>=0.12",
    "rich>=13",
    "mcp>=1.0",
    "rapidocr-onnxruntime>=1.2,<1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6",
]

[project.scripts]
omoide = "omoide.cli:app"

[tool.setuptools.packages.find]
include = ["omoide*"]

[tool.setuptools.package-data]
omoide = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
